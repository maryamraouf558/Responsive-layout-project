<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- NAV -->
    <nav>
        <div class="logo">Logo</div>
        <div class="menu">Menu</div>
    </nav>

    <!-- PAGE -->
    <div class="page">

        <!-- LEFT / MAIN -->
        <div class="main">

            <div class="header">Header</div>

            <div class="middle">

                <!-- ARTICLES -->
                <div class="articles">

                    <div class="row">
                        <div class="article">Article 1</div>
                        <div class="article">Article 2</div>
                    </div>

                    <div class="row">
                        <div class="article">Article 3</div>
                        <div class="article">Article 4</div>
                    </div>

                </div>

                <!-- SOCIAL -->
                <div class="side">

                    <div class="social">
                        Social
                    </div>

                    <div class="tagcloud">
                        Tagcloud
                    </div>

                </div>

            </div>

            <footer>
                Footer
            </footer>

        </div>

        <!-- ADS -->
        <div class="ads">
            Ads
        </div>

    </div>

</div>

</body>
</html>
